name: Test

on:
  pull_request:
  push:
    branches: [latest]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-version:
    name: Resolve versions (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The bot runs on lts/*; latest and an older LTS catch the next rollover early.
        node: ['24', 'lts/*', 'latest']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: bash test/resolve-version.test.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck scripts/*.sh test/*.sh
